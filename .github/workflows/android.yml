name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: SDK Android (préinstallé sur les runners GitHub)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Tests du moteur (règles, cartes, IA contre IA)
        run: ./gradlew :core:test --no-daemon

      - name: Compilation de l'APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: kratour-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
