name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: SDK Android (préinstallé sur les runners GitHub)
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Tests du moteur (règles, cartes, IA contre IA)
        run: ./gradlew :core:test --no-daemon

      - name: Compilation de l'APK
        run: |
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk Kratour.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kratour-apk
          path: Kratour.apk

      # Lien de téléchargement direct (sans compte GitHub) : Releases > « Dernière version ».
      - name: Publication de l'APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: Kratour — dernière version
          prerelease: true
          make_latest: true
          files: Kratour.apk
          body: |
            APK de Kratour compilé automatiquement depuis la branche ${{ github.ref_name }} (commit ${{ github.sha }}).
            Sur le téléphone : télécharger Kratour.apk, l'ouvrir, autoriser l'installation d'applications inconnues si demandé.
